<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t d">
  <title id="t">ClearGate on AgntID: architecture</title>
  <desc id="d">On-call engineer speaks to the ClearGate agent team. Every tool call goes through the customer-hosted AgntID runtime (visibility, intent, policy, runtime-held credential, execute, audit) to the github, payments and comms MCP servers. The AgntID portal is the control plane. ClearGate adds digest-bound human approval, a signed record, an attack suite, a policy writer, a CI gate and an evidence pack. The stock path calls the MCP servers directly with no runtime.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #0F172A; }
    .title { font-size: 24px; font-weight: 700; }
    .sub { font-size: 13px; fill: #475569; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 11.5px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #334155; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .red { fill: #B91C1C; }
    .lbl { font-size: 11.5px; fill: #334155; }
  </style>

  <!-- solid card so it reads on GitHub light and dark -->
  <rect x="0" y="0" width="1200" height="880" rx="16" fill="#FFFFFF"/>
  <rect x="6" y="6" width="1188" height="868" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>

  <text x="30" y="42" class="title">ClearGate on AgntID</text>
  <text x="30" y="64" class="sub">The agent acts. AgntID decides. The engineer signs.</text>

  <!-- ================= AgntID portal (control plane) ================= -->
  <rect x="560" y="22" width="300" height="74" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="710" y="44" class="h" text-anchor="middle">AgntID portal</text>
  <text x="710" y="62" class="s" text-anchor="middle">control plane only, executes no tool calls</text>
  <text x="710" y="80" class="s" text-anchor="middle">policies · profile · labels · Simulator · Reporting</text>
  <line x1="660" y1="98" x2="660" y2="146" stroke="#B45309" stroke-width="1.6" marker-end="url(#a-amber)"/>
  <text x="652" y="126" class="lbl" text-anchor="end">policies sync down</text>
  <line x1="760" y1="146" x2="760" y2="98" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a-amber)"/>
  <text x="768" y="126" class="lbl">decisions reported up</text>

  <!-- ================= On-call engineer ================= -->
  <rect x="24" y="150" width="164" height="120" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <circle cx="106" cy="180" r="13" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M84,210 q22,-20 44,0" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="106" y="234" class="h" text-anchor="middle">On-call engineer</text>
  <text x="106" y="252" class="s" text-anchor="middle">asks by voice, 2 a.m.</text>
  <line x1="188" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="1.8" marker-end="url(#a-gray)"/>
  <text x="204" y="192" class="lbl" text-anchor="middle">task</text>

  <!-- engineer approves via voice call -->
  <line x1="106" y1="270" x2="106" y2="688" stroke="#6D28D9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-purple)" marker-start="url(#a-purple)"/>
  <rect x="22" y="380" width="168" height="62" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="106" y="400" class="lbl" text-anchor="middle">on-call voice call:</text>
  <text x="106" y="417" class="mono" text-anchor="middle">"approve 3fa9"</text>
  <text x="106" y="433" class="lbl" text-anchor="middle">code = first 4 hex of args digest</text>

  <!-- ================= Agent team ================= -->
  <g transform="translate(-36,0)">
  <rect x="258" y="150" width="252" height="440" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="384" y="174" class="h" text-anchor="middle">ClearGate agent team</text>
  <text x="384" y="191" class="s" text-anchor="middle">holds no GitHub credential in gated mode</text>

  <rect x="278" y="204" width="212" height="48" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="384" y="225" class="b" text-anchor="middle" font-weight="700">Orchestrator</text>
  <text x="384" y="242" class="s" text-anchor="middle">opens one AgntID task</text>

  <!-- delegation spine -->
  <line x1="290" y1="252" x2="290" y2="547" stroke="#2563EB" stroke-width="1.6"/>
  <text x="296" y="276" class="s" font-style="italic">each hop = its own delegation</text>

  <g>
    <line x1="290" y1="315" x2="306" y2="315" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <rect x="308" y="288" width="186" height="54" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="318" y="308" class="b" font-weight="700">triage</text>
    <text x="362" y="308" class="s">read-only</text>
    <text x="318" y="328" class="s">issue, CI logs, code (GitHub)</text>

    <line x1="290" y1="379" x2="306" y2="379" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <rect x="308" y="352" width="186" height="54" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="318" y="372" class="b" font-weight="700">db</text>
    <text x="342" y="372" class="s">read-only</text>
    <text x="318" y="392" class="s">query_refunds, get_order</text>

    <line x1="290" y1="443" x2="306" y2="443" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <rect x="308" y="416" width="186" height="54" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="318" y="436" class="b" font-weight="700">fix</text>
    <text x="344" y="436" class="s">fix/ branch + PR</text>
    <text x="318" y="456" class="s">merge needs engineer approval</text>

    <line x1="290" y1="507" x2="306" y2="507" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <rect x="308" y="480" width="186" height="54" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="318" y="500" class="b" font-weight="700">comms</text>
    <text x="370" y="500" class="s">one channel</text>
    <text x="318" y="520" class="s">post_incident_update, #inc-4471</text>
  </g>
  <text x="384" y="566" class="s" text-anchor="middle">brain: Bedrock Claude, or scripted</text>
  <text x="384" y="581" class="s" text-anchor="middle">(deterministic for the stage)</text>
  </g>

  <!-- team -> runtime -->
  <line x1="474" y1="300" x2="574" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a-gray)"/>
  <text x="484" y="280" class="lbl">MCP call</text>
  <text x="484" y="293" class="mono" font-size="10.5">+_task_id</text>
  <text x="484" y="318" class="mono" font-size="10.5">+_deleg_id</text>
  <line x1="574" y1="530" x2="474" y2="530" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a-gray)"/>
  <text x="484" y="548" class="lbl">result, BLOCK</text>
  <text x="484" y="562" class="lbl">or ESCALATE</text>

  <!-- ================= AgntID runtime ================= -->
  <rect x="576" y="148" width="284" height="460" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="718" y="172" class="h" text-anchor="middle">AgntID runtime</text>
  <text x="718" y="189" class="s" text-anchor="middle">customer-hosted (Docker) · MCP proxy</text>
  <text x="718" y="204" class="mono" text-anchor="middle">localhost:8082/mcp</text>

  <g>
    <rect x="594" y="216" width="248" height="52" rx="8" fill="#FFFFFF" stroke="#34D399"/>
    <circle cx="612" cy="242" r="10" fill="#059669"/><text x="612" y="246" class="num" text-anchor="middle">1</text>
    <text x="630" y="237" class="b" font-weight="700">Visibility</text>
    <text x="630" y="255" class="s">profile Medium narrows list_tools</text>
    <line x1="718" y1="268" x2="718" y2="278" stroke="#047857" stroke-width="1.6" marker-end="url(#a-green)"/>

    <rect x="594" y="280" width="248" height="52" rx="8" fill="#FFFFFF" stroke="#34D399"/>
    <circle cx="612" cy="306" r="10" fill="#059669"/><text x="612" y="310" class="num" text-anchor="middle">2</text>
    <text x="630" y="301" class="b" font-weight="700">Intent check</text>
    <text x="630" y="319" class="s">call vs. the engineer's task (LLM)</text>
    <line x1="718" y1="332" x2="718" y2="342" stroke="#047857" stroke-width="1.6" marker-end="url(#a-green)"/>

    <rect x="594" y="344" width="248" height="52" rx="8" fill="#FFFFFF" stroke="#34D399"/>
    <circle cx="612" cy="370" r="10" fill="#059669"/><text x="612" y="374" class="num" text-anchor="middle">3</text>
    <text x="630" y="365" class="b" font-weight="700">Policy check</text>
    <text x="630" y="383" class="s">per-tool + parameter limits (Rego)</text>
    <line x1="718" y1="396" x2="718" y2="406" stroke="#047857" stroke-width="1.6" marker-end="url(#a-green)"/>

    <rect x="594" y="408" width="248" height="52" rx="8" fill="#FFFFFF" stroke="#34D399"/>
    <circle cx="612" cy="434" r="10" fill="#059669"/><text x="612" y="438" class="num" text-anchor="middle">4</text>
    <text x="630" y="429" class="b" font-weight="700">Credential</text>
    <text x="630" y="447" class="s">GitHub token held by the runtime</text>
    <line x1="718" y1="460" x2="718" y2="470" stroke="#047857" stroke-width="1.6" marker-end="url(#a-green)"/>

    <rect x="594" y="472" width="248" height="52" rx="8" fill="#FFFFFF" stroke="#34D399"/>
    <circle cx="612" cy="498" r="10" fill="#059669"/><text x="612" y="502" class="num" text-anchor="middle">5</text>
    <text x="630" y="493" class="b" font-weight="700">Execute</text>
    <text x="630" y="511" class="s">forward only the allowed call</text>
    <line x1="718" y1="524" x2="718" y2="534" stroke="#047857" stroke-width="1.6" marker-end="url(#a-green)"/>

    <rect x="594" y="536" width="248" height="52" rx="8" fill="#FFFFFF" stroke="#34D399"/>
    <circle cx="612" cy="562" r="10" fill="#059669"/><text x="612" y="566" class="num" text-anchor="middle">6</text>
    <text x="630" y="557" class="b" font-weight="700">Audit</text>
    <text x="630" y="575" class="s">every decision to Reporting</text>
  </g>

  <!-- runtime -> MCP servers (fan out from Execute) -->
  <path d="M842,498 H878" fill="none" stroke="#047857" stroke-width="2"/>
  <path d="M878,498 V250 H904" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a-green)"/>
  <path d="M878,370 H904" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a-green)"/>
  <path d="M878,498 H904" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a-green)"/>

  <!-- ================= MCP servers ================= -->
  <text x="1038" y="172" class="h" text-anchor="middle">MCP servers</text>
  <text x="1038" y="189" class="s" text-anchor="middle">reachable only through the runtime</text>

  <rect x="906" y="204" width="264" height="96" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="920" y="226" class="b" font-weight="700">github</text>
  <text x="972" y="226" class="s">official remote MCP</text>
  <text x="920" y="244" class="mono">api.githubcopilot.com/mcp</text>
  <text x="920" y="262" class="s">46 tools today (41 in April)</text>
  <text x="920" y="284" class="b">→ GitHub repo, issue, PR</text>

  <rect x="906" y="322" width="264" height="96" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="920" y="344" class="b" font-weight="700">payments</text>
  <text x="990" y="344" class="mono">:9101</text>
  <text x="920" y="362" class="s">query_refunds, get_order, issue_refund,</text>
  <text x="920" y="378" class="s">export_customer_records, run_sql</text>
  <text x="920" y="402" class="b">→ Postgres ledger</text>

  <rect x="906" y="440" width="264" height="96" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="920" y="462" class="b" font-weight="700">comms</text>
  <text x="972" y="462" class="mono">:9102</text>
  <text x="920" y="480" class="s">post_incident_update, post_message,</text>
  <text x="920" y="496" class="s">send_email</text>
  <text x="920" y="520" class="b">→ Slack · email stub outbox</text>

  <!-- ================= Stock path (no runtime) ================= -->
  <path d="M348,590 V626 H1100 V538" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#a-red)"/>
  <rect x="560" y="614" width="400" height="24" rx="4" fill="#F8FAFC"/>
  <text x="760" y="631" class="b red" text-anchor="middle" font-weight="700">Stock path: agents call MCP servers directly</text>
  <text x="1092" y="652" class="s red" text-anchor="end">no runtime · agent holds the PAT · sees every tool</text>

  <!-- team -> ClearGate layer -->
  <line x1="264" y1="590" x2="264" y2="688" stroke="#6D28D9" stroke-width="1.8" marker-end="url(#a-purple)"/>
  <text x="272" y="668" class="lbl">every decision, ESCALATE</text>

  <!-- ================= ClearGate layer ================= -->
  <rect x="22" y="690" width="1156" height="170" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="40" y="714" class="h">ClearGate's own layer</text>
  <text x="212" y="714" class="s">app layer, outside the runtime: built on AgntID decisions, not a second enforcer</text>

  <g>
    <rect x="38" y="726" width="176" height="120" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
    <text x="50" y="748" class="b" font-weight="700">Human approval</text>
    <text x="50" y="768" class="s">voice on-call call or click</text>
    <text x="50" y="785" class="s">bound to SHA-256 of the</text>
    <text x="50" y="801" class="s">canonical args; single use,</text>
    <text x="50" y="817" class="s">300 s expiry</text>
    <text x="50" y="836" class="s red">changed args ⇒ BLOCK</text>

    <rect x="226" y="726" width="176" height="120" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
    <text x="238" y="748" class="b" font-weight="700">Signed record</text>
    <text x="238" y="768" class="s">JSONL, one decision a line</text>
    <text x="238" y="785" class="s">hash-chained, Ed25519</text>
    <text x="238" y="801" class="s">policy_version + args digest</text>
    <text x="238" y="836" class="mono">→ verify.py (offline)</text>

    <rect x="414" y="726" width="176" height="120" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
    <text x="426" y="748" class="b" font-weight="700">Attack suite</text>
    <text x="426" y="768" class="s">20 out-of-task calls,</text>
    <text x="426" y="785" class="s">OWASP Agentic tags</text>
    <text x="426" y="801" class="s">stock vs. gated, same calls</text>
    <text x="426" y="836" class="mono">attacks/catalog.yaml</text>

    <rect x="602" y="726" width="176" height="120" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
    <text x="614" y="748" class="b" font-weight="700">Policy writer</text>
    <text x="614" y="768" class="s">proposes least privilege</text>
    <text x="614" y="785" class="s">from observed calls;</text>
    <text x="614" y="801" class="s">replay + diff shows flips</text>
    <text x="614" y="836" class="mono">propose-policy</text>

    <rect x="790" y="726" width="176" height="120" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
    <text x="802" y="748" class="b" font-weight="700">CI gate</text>
    <text x="802" y="768" class="s">policy change in a PR</text>
    <text x="802" y="785" class="s">re-runs the attacks;</text>
    <text x="802" y="801" class="s">regression = red check</text>
    <text x="802" y="836" class="mono">SARIF → code scanning</text>

    <rect x="978" y="726" width="184" height="120" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
    <text x="990" y="748" class="b" font-weight="700">Evidence pack</text>
    <text x="990" y="768" class="s">GO / NO-GO for the engineer</text>
    <text x="990" y="785" class="s">counts, record, policy,</text>
    <text x="990" y="801" class="s">control → regulation map</text>
    <text x="990" y="836" class="mono">cleargate evidence</text>
  </g>
</svg>
