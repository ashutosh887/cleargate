[project]
name = "cleargate"
version = "0.1.0"
description = "Go-live gate for AI agents that move money, change code or touch customer data. The agent acts. AgntID decides. The engineer signs."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
    "fastmcp>=2.14,<3",
]

[project.scripts]
cleargate = "cleargate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cleargate"]
