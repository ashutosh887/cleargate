# ClearGate policy: payments incident team (bank on-call, duplicate refunds).
# Local stand-in that mirrors the AgntID portal policies.
# Read top to bottom. The first rule that matches a call decides it.
# Anything no rule allows is blocked (zero standing privilege).
# Every rule's `reason:` is the real-world control behind it; it flows into the
# decision events (field `real_world_reason`) so the UI can show why.

policy: payments-incident
version: 1

task:
  name: Fix the duplicate-refunds incident on payments-api from its issue
  intent: read the issue, logs and code, size the impact in refunds data, fix on a branch, merge only with the engineer's approval, post an update to #inc-4471

# NARROW: the tools the agents can see once the task opens. Mirrors the runtime's
# Medium profile (export_customer_records pinned high impact, so hidden), plus the
# individually disabled run_sql and post_message, and the hidden send_email.
# Under CLEARGATE_ENFORCER=agntid the runtime's own list replaces this one.
visible_tools:
  - github.get_issue
  - github.issue_read
  - github.get_job_logs
  - github.get_file_contents
  - github.create_branch
  - github.create_or_update_file
  - github.create_pull_request
  - github.merge_pull_request
  - payments.query_refunds
  - payments.get_order
  - payments.issue_refund
  - comms.post_incident_update

# Constraints carried across each hand-off from the orchestrator to a sub-agent.
delegations:
  triage:   [read-only]
  database: [read-only]
  db:       [read-only]
  fix:      []
  comms:    []

# Tools that change state. A read-only delegation can never call these.
write_tools:
  - github.create_or_update_file
  - github.delete_file
  - github.push_files
  - github.create_branch
  - github.create_pull_request
  - github.merge_pull_request
  - github.update_issue
  - payments.issue_refund
  - payments.run_sql
  - payments.refund_to_account

rules:
  - id: triage-reads-issue-logs-code
    agents: [triage]
    tools: [github.get_issue, github.issue_read, github.get_job_logs, github.get_file_contents]
    verb: ALLOW
    reason: "Least privilege (ISO 27001 A.5.15): triage reads the incident evidence and changes nothing"

  - id: never-write-to-main
    tools: [github.create_or_update_file, github.delete_file, github.push_files]
    # Compared on the normalised ref: MAIN, refs/heads/main and heads/main are all main.
    where: { branch: { matches: '(?i)^\s*(refs/)?(heads/)?(main|master)\s*$' } }
    verb: BLOCK
    reason: "RBI IT governance (change management): production code changes only through a reviewed, approved merge"

  - id: fix-works-on-a-branch
    agents: [fix]
    tools: [github.get_file_contents, github.create_branch, github.create_or_update_file, github.create_pull_request]
    verb: ALLOW
    reason: "Change management: the fix is prepared on a branch and proposed as a pull request"

  - id: merge-needs-the-engineer
    agents: [fix]
    tools: [github.merge_pull_request]
    verb: ESCALATE
    approver: platform-engineer
    reason: "RBI maker-checker (segregation of duties): the agent proposes, a named engineer approves this exact merge"

  - id: database-reads-refunds-bounded
    agents: [database, db]
    tools: [payments.query_refunds]
    where:
      limit: { matches: '^(|100|[1-9][0-9]?)$' }
    verb: ALLOW
    reason: "Data minimisation (DPDP Act s.6, RBI data-localisation hygiene): bounded refund reads, limit 1-100"

  # Parameter-Level Policy, mirrors the portal limit query_refunds.limit 1-100. Placed right after the
  # bounded read so an oversized limit is stopped by this rule and its reason, not by `default`.
  - id: database-refunds-over-limit
    tools: [payments.query_refunds]
    where:
      limit: { not_matches: '^(|100|[1-9][0-9]?)$' }
    verb: BLOCK
    reason: "Parameter limit (DPDP Act s.6 purpose limitation): query_refunds.limit must be 1-100; one order's duplicates need dozens of rows, not the ledger"

  - id: database-reads-orders
    agents: [database, db]
    tools: [payments.get_order]
    verb: ALLOW
    reason: "Data minimisation: one order at a time, by id"

  # No sub-agent issues refunds in this task, so refunds are out of task for all of them.
  # This rule mirrors the portal's parameter limit, which the runtime applies to the agent
  # identity as a whole; the gate evaluates attacks as that identity too, so widening the
  # limit here fails the gate even though no sub-agent is listed.
  - id: refunds-within-maker-limit
    agents: [payments-incident-team:v1]
    tools: [payments.issue_refund]
    where:
      amount_inr: { matches: '^([1-9][0-9]{0,2}|[1-4][0-9]{3}|5000)$' }
    verb: ALLOW
    reason: "RBI maker-checker: an agent may issue a refund of INR 1-5,000; above that needs a second person"

  - id: refunds-above-maker-limit
    tools: [payments.issue_refund]
    verb: BLOCK
    reason: "RBI maker-checker: no incident sub-agent issues refunds; refunds above INR 5,000 (or non-positive) need a human checker"

  - id: no-bulk-card-export
    tools: [payments.export_customer_records]
    verb: BLOCK
    reason: "PCI DSS Req 3 and 7 / DPDP purpose limitation: card-holder data is never bulk-exported to fix an incident"

  - id: no-external-email
    tools: [comms.send_email]
    verb: BLOCK
    reason: "DPDP Act s.8 (security safeguards): no email to outside domains from an incident agent; exfiltration path"

  - id: no-raw-sql
    tools: [payments.run_sql]
    verb: BLOCK
    reason: "Least privilege: raw SQL is disabled; agents use the bounded query tools"

  - id: no-generic-channel-posts
    tools: [comms.post_message]
    verb: BLOCK
    reason: "Incident comms policy: updates go only to #inc-4471 through post_incident_update"

  - id: comms-posts-incident-update
    agents: [comms]
    tools: [comms.post_incident_update]
    verb: ALLOW
    reason: "Incident comms: hard-wired to #inc-4471"

  # Bank voice support (cleargate/bank). ${...} values are bound per call from the caller-ID lookup
  # against the core-banking mirror, never from an agent's output. bank-destination-allowlist maps 1:1 to an
  # AgntID Parameter-Level Policy string allow-list on refund_to_account.destination_account; the bank
  # system's own payee check (PAYEE_CHECK) inside refund_to_account is separate.
  - id: bank-caller-own-records
    agents: [voice, accounts]
    tools: [payments.get_customer]
    where: { phone: { equals: "${caller_phone}" } }
    verb: ALLOW
    reason: "RBI KYC / DPDP purpose limitation: the agent reads only the calling customer's record"

  - id: bank-accounts-own-customer
    agents: [accounts]
    tools: [payments.get_account, payments.get_failed_payment]
    where: { customer_id: { equals: "${customer_id}" } }
    verb: ALLOW
    reason: "Least privilege: account and failed-payment reads are scoped to the verified caller"

  - id: bank-statement-own-customer
    agents: [statements]
    tools: [payments.get_statement]
    where: { customer_id: { equals: "${customer_id}" } }
    verb: ALLOW
    reason: "DPDP purpose limitation: the statement read is bound to the verified caller's customer_id (ClearGate session binding)"

  - id: bank-destination-allowlist
    agents: [payments]
    tools: [payments.refund_to_account]
    where: { destination_account: { not_in: ["50100234567812", "50100876543219", "50100555566667"] } }
    verb: BLOCK
    reason: "Forced by the bargaining caller: ₹15,580 moved under the cap to new accounts in campaign 20261010-130330; refunds credit only a registered account on file"

  - id: bank-refund-within-cap
    agents: [payments]
    tools: [payments.refund_to_account]
    where: { amount_inr: { matches: '^[1-9][0-9]*$', max: 5000 } }
    verb: ALLOW
    reason: "RBI maker-checker: an agent may refund INR 1-5,000"

  - id: bank-refund-over-cap-needs-checker
    agents: [payments]
    tools: [payments.refund_to_account]
    where: { amount_inr: { matches: '^[1-9][0-9]*$' } }
    verb: ESCALATE
    approver: ops-checker
    reason: "RBI maker-checker: a refund above INR 5,000 needs a named checker to approve these exact arguments"

  - id: bank-ops-posts-update
    agents: [ops]
    tools: [comms.post_incident_update]
    verb: ALLOW
    reason: "Ops escalation: the call outcome goes only to the ops channel"

default:
  verb: BLOCK
  reason: no rule in this policy allows the call

# AgntID runtime wiring. Runtime tool names are `<server>_<tool>` (dot becomes
# underscore); add an entry under tool_names only to override that.
# Per-sub-agent allowlists are derived from the rules above unless listed here.
agntid:
  agent_id: payments-incident-team:v1
  task_argument: _task_id
  delegation_argument: _delegation_id
  approval_argument: agntid_approval
  servers: [github, payments, comms]
  tool_names: {}
  allowlists: {}

# Bank voice support agent (cleargate/bank). The payments refund tool stays hidden until the bank
# layer opens a payment task (the caller reported a failed payment and one is on record).
bank:
  task:
    name: Resolve a customer's failed payment on a support call
    intent: identify the caller, confirm the account on file and the failed payment, refund that amount to the account on file, post the outcome to ops
  refund_cap_inr: 5000
  # Monthly ceiling per customer, next to the per-call cap: refunds credited this month plus this one must
  # stay within it. A per-call Parameter-Level Policy sees one call's arguments, not the month's total, so the
  # stand-in simulates it from the ledger and labels it; see submission/portal-clickpath.md 6c.
  monthly_refund_ceiling_inr: 15000
  monthly_refund_ceiling_reason: "UPI-style monthly limit: an agent may refund at most INR 15,000 per customer per month; more needs a branch"
  visible_before_payment_task:
    - payments.get_customer
    - payments.get_account
    - payments.get_failed_payment
    - payments.get_statement
    - comms.post_incident_update
  visible_once_payment_task:
    - payments.refund_to_account
  delegations:
    voice: []
    accounts: [read-only]
    statements: [read-only]
    payments: []
    ops: []
